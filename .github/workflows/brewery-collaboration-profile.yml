name: Brewery collaboration profile

on:
  push:
    branches:
      - feature/brewery-collaborations
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/brewery-collaborations
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply brewery profile collaboration patch
        run: node scripts/patch-brewery-profile-collaborations.cjs

      - name: Build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/breweries/[id]/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Show brewery collaborations on brewery profiles"
          git push origin HEAD:feature/brewery-collaborations
