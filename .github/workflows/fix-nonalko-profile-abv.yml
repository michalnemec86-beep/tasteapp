name: Fix non-alcoholic profile ABV

on:
  push:
    branches:
      - fix/nonalko-profile-abv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/nonalko-profile-abv
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply ABV fix
        run: node scripts/patch-nonalko-profile-abv.cjs

      - name: Build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/profiles/[id]/page.tsx lib/profileStats.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Exclude non-alcoholic beers from profile ABV stats"
          git push origin HEAD:fix/nonalko-profile-abv
