name: Nomadic brewery and pagination

on:
  push:
    branches:
      - nomadic-pagination
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nomadic-pagination
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix patch targeting
        run: node scripts/fix-tech-batch.cjs

      - name: Apply tech batch
        run: node scripts/apply-tech-batch.cjs

      - name: Build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add nomadic breweries, style drilldowns and non-alcoholic beer support"
          git push origin HEAD:nomadic-pagination
