<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160e08">
  <title>Pivník · Bez připojení</title>
  <link rel="icon" href="/pwa-icon/192.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 0,#34210f,transparent 65%),#160e08;color:#f6efe3;font-family:system-ui,sans-serif}main{max-width:420px;text-align:center;border:1px solid #e7a62f40;border-radius:24px;padding:32px 24px;background:#21150c;box-shadow:0 20px 60px #0005}img{border-radius:24px;width:88px;height:88px}h1{color:#ffc052;font-size:26px;line-height:1.2;margin:24px 0 12px}p{font-size:15px;line-height:1.6;color:#d8c8b1}button{min-height:48px;width:100%;margin-top:12px;padding:12px 20px;border:1px solid #aac778;border-radius:12px;background:linear-gradient(135deg,#aec575,#7d9948);color:#17200d;font:750 15px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #ffc052;outline-offset:4px}small{display:block;color:#a7957c;font-size:12px;line-height:1.6;margin-top:20px}
  </style>
  <script src="/offline.js" defer></script>
</head>
<body><main>
  <img src="/pwa-icon/192.png" alt="Pivník" width="88" height="88">
  <h1>Na chvíli jsme bez připojení</h1>
  <p id="connection-message" role="status">Pivník potřebuje internet pro načtení deníku a uložení ochutnávky. Zkontroluj Wi-Fi nebo mobilní data a zkus to znovu.</p>
  <button id="retry" type="button">Zkusit znovu</button>
  <small>Už uložené ochutnávky zůstávají v bezpečí. Novou ochutnávku zapiš po obnovení připojení.</small>
</main></body>
</html>
