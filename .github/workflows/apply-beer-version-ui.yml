name: Apply beer version UI patch

on:
  push:
    paths:
      - scripts/apply-beer-version-ui.py
      - .github/workflows/apply-beer-version-ui.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/apply-beer-version-ui.py

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Diff check
        run: git diff --check

      - name: Commit patch
        run: |
          rm scripts/apply-beer-version-ui.py
          rm .github/workflows/apply-beer-version-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add beer recipe version UI"
          git push origin HEAD:main
